name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  linux-build:
    name: Linux build
    runs-on: ubuntu-24.04
    container:
      image: archlinux:base-devel
    steps:
      - name: Install CI dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm git cmake ninja obs-studio qt6-base qt6-websockets

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset linux-ci-x86_64

      - name: Build
        run: cmake --build --preset linux-ci-x86_64

      - name: Verify plugin artifact
        run: test -f build/linux-ci-x86_64/bokis-twitch-chat-plugin.so
