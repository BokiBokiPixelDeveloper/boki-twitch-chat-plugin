name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-build:
    name: Windows build
    uses: ./.github/workflows/windows-build.yml

  linux-build:
    name: Linux build
    runs-on: ubuntu-24.04
    container:
      image: archlinux:base-devel
    steps:
      - name: Install CI dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm git cmake ninja obs-studio qt6-base qt6-websockets libwebp python zip

      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure
        run: cmake --preset linux-ci-x86_64 -DENABLE_TESTS=ON

      - name: Build
        run: cmake --build --preset linux-ci-x86_64

      - name: Test
        run: ctest --test-dir build/linux-ci-x86_64 --output-on-failure

      - name: Verify plugin artifact
        run: |
          test -f build/linux-ci-x86_64/bokis-twitch-chat-plugin.so
          test -x build/linux-ci-x86_64/bokis-twitch-chat-updater
