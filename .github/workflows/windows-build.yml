name: Windows build and package

on:
  workflow_call:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap pinned dependencies
        shell: pwsh
        run: ./scripts/bootstrap-windows.ps1
      - name: Configure
        run: cmake --preset windows-x86_64
      - name: Build
        run: cmake --build --preset windows-x86_64
      - name: Test
        run: ctest --test-dir build/windows-x86_64 -C RelWithDebInfo --output-on-failure
      - name: Package and compile installer
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - name: Verify Windows manifest
        shell: pwsh
        run: |
          python scripts/generate-manifest.py release --repository "$env:GITHUB_REPOSITORY" --platform windows-x86_64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/generate-manifest.py release --repository "$env:GITHUB_REPOSITORY" --platform windows-x86_64 --verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Installer and package smoke tests
        shell: pwsh
        run: ./tests/windows-installer-tests.ps1
      - name: Upload Windows release payload
        uses: actions/upload-artifact@v7
        with:
          name: release-payload-windows
          if-no-files-found: error
          path: |
            release/*.dll
            release/*.exe
            release/*.zip
            release/*.sha256
