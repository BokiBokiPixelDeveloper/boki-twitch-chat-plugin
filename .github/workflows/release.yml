name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-linux:
    name: Build Linux release
    runs-on: ubuntu-24.04
    container:
      image: archlinux:base-devel
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm git cmake ninja obs-studio qt6-base qt6-websockets libwebp zip

      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate tag matches VERSION
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          TAG="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" != "$TAG" ]]; then
            echo "VERSION=$VERSION does not match tag=$TAG" >&2
            exit 1
          fi

      - name: Configure
        run: cmake --preset linux-x86_64

      - name: Build
        run: cmake --build --preset linux-x86_64

      - name: Package
        run: ./scripts/package.sh

      - name: Generate update manifest
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          ZIP="bokis-twitch-chat-plugin-${VERSION}-linux-x86_64.zip"
          BINARY="bokis-twitch-chat-plugin-${VERSION}-linux-x86_64.so"
          HASH="$(cut -d' ' -f1 "release/${BINARY}.sha256")"
          SIZE="$(stat -c%s "release/${BINARY}")"
          cat > release/update-manifest.json <<JSON
          {
            "schema": 1,
            "version": "${VERSION}",
            "channel": "stable",
            "platforms": {
              "linux-x86_64": {
                "url": "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${BINARY}",
                "sha256": "${HASH}",
                "size": ${SIZE}
              }
            },
            "obs": {
              "minVersion": "32.0.0",
              "maxMajorVersion": 32
            }
          }
          JSON

      - name: Upload release payload
        uses: actions/upload-artifact@v7
        with:
          name: release-payload
          path: |
            release/*.zip
            release/*.so
            release/*.sha256
            release/update-manifest.json

  publish:
    name: Publish GitHub Release
    needs: build-linux
    runs-on: ubuntu-24.04
    steps:
      - name: Download release payload
        uses: actions/download-artifact@v4
        with:
          name: release-payload
          path: release

      - name: Create immutable-ready release payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes \
            --title "${GITHUB_REF_NAME}"
