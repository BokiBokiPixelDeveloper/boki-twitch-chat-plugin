name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-linux:
    name: Build Linux release
    runs-on: ubuntu-24.04
    container:
      image: archlinux:base-devel
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm git cmake ninja obs-studio qt6-base qt6-websockets libwebp python zip

      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate tag matches VERSION
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          TAG="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" != "$TAG" ]]; then
            echo "VERSION=$VERSION does not match tag=$TAG" >&2
            exit 1
          fi

      - name: Configure
        run: cmake --preset linux-x86_64 -DENABLE_TESTS=ON

      - name: Build
        run: cmake --build --preset linux-x86_64

      - name: Test
        run: ctest --test-dir build/linux-x86_64 --output-on-failure

      - name: Package
        run: ./scripts/package.sh

      - name: Upload release payload
        uses: actions/upload-artifact@v4
        with:
          name: release-payload-linux
          path: |
            release/*.zip
            release/*.so
            release/*.bin
            release/*.sha256

  build-windows:
    name: Build Windows release
    uses: ./.github/workflows/windows-build.yml

  publish:
    name: Publish GitHub Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download release payload
        uses: actions/download-artifact@v8
        with:
          pattern: release-payload-*
          merge-multiple: true
          path: release

      - name: Generate and verify combined manifest
        run: |
          python scripts/generate-manifest.py release --repository "$GITHUB_REPOSITORY"
          python scripts/generate-manifest.py release --repository "$GITHUB_REPOSITORY" --verify

      - name: Create immutable-ready release payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes \
            --title "${GITHUB_REF_NAME}"
